<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Editing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light custom-body">

    <div class="container mt-5">
        <div class="card custom-card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0">HTML Forms</h3>
            </div>
            <div class="card-body">
                <form action="index.html">
                    <div class="mb-3">
                        <label class="form-label">Textbox</label>
                        <input type="text" class="form-control" name="txtText" size="5">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="txtPassword">
                    </div>

                    <input type="hidden" name="txtHidden" value="">

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="chkCheck" value="ON" checked>
                        <label class="form-check-label">Male</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rdo" value="Single" checked>
                            <label class="form-check-label">Single</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rdo" value="Married">
                            <label class="form-check-label">Married</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="rdo" value="Divorced">
                            <label class="form-check-label">Divorced</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">ComboBox</label>
                        <select class="form-select" name="txtCombo">
                            <option value="Servlet">JSP and Servlet</option>
                            <option value="EJB">EJB</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Multiple</label>
                        <select class="form-select" name="txtlist" multiple size="3">
                            <option value="Servlet" selected>JSP and Servlet</option>
                            <option value="EJB" selected>EJB</option>
                            <option value="Java">Core Java</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">TextArea</label>
                        <textarea class="form-control" name="txtArea" rows="4">This is a form parameters demo!!!!</textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <button type="submit" class="btn btn-success">Submit</button>
                        <button type="submit" class="btn btn-primary" name="action" value="Register">Register</button>
                        <button type="reset" class="btn btn-warning">Reset</button>
                        <button type="reset" class="btn btn-danger" onclick="alert('Resetting...')">JavaScript</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
